# Design-time draft of the search API contract.
# Source of truth after implementation: the OpenAPI document generated from the backend code
# (committed as apps/api/openapi/openapi.json). If they differ, update this draft or the spec.
# Reconciled with that document in T059 (2026-10-30): springdoc emits OpenAPI 3.1, so this draft
# uses 3.1 too. Known remaining difference: the generated document adds an operation tag and does
# not list the `instance` field that error responses carry (the request path).
openapi: 3.1.0
info:
  title: TripDesk API
  version: 0.1.0
paths:
  /api/v1/hotels/search:
    get:
      operationId: searchHotels
      summary: Search available hotels by city and dates
      description: >
        Returns one page (20 items) of hotels in the city that are available for the stay
        [checkIn, checkOut) and can accommodate the requested number of guests
        (hotel max_guests >= guests). No authentication. Input is always validated on the server;
        when validation fails no search is performed.
      parameters:
        - { name: city, in: query, required: true, schema: { type: string }, description: Matched trimmed, case-insensitive }
        - { name: checkIn, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkOut, in: query, required: true, schema: { type: string, format: date } }
        - { name: guests, in: query, required: true, schema: { type: integer }, description: "Validated against the configured range (1 to 10); only hotels whose capacity is at least this number are returned" }
        - { name: minPrice, in: query, required: false, schema: { type: integer, minimum: 0 }, description: "Lower price bound per night in cents, inclusive. Blank is treated as absent. A negative or non-integer value is `INVALID_VALUE`." }
        - { name: maxPrice, in: query, required: false, schema: { type: integer, minimum: 0 }, description: "Upper price bound per night in cents, inclusive. Blank is treated as absent. A negative or non-integer value is `INVALID_VALUE`. A `minPrice` above `maxPrice` is `INVALID_PRICE_RANGE`, reported on this field." }
        - { name: minStars, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5 }, description: "Minimum star rating, inclusive. Blank is treated as absent. An integer outside 1 to 5 is `INVALID_STARS`; a non-integer value is `INVALID_VALUE`." }
        - name: sort
          in: query
          required: false
          description: "Case-sensitive. Blank is treated as the default. An unknown value is `INVALID_SORT`."
          schema: { type: string, enum: [price_asc, price_desc, stars_desc, stars_asc], default: price_asc }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "Opaque; use nextCursor from the previous page. Valid only with unchanged criteria, filters and sort; the result is undefined otherwise (a cursor issued for a different sort is rejected as `INVALID_CURSOR`)." }
      responses:
        "200":
          description: A page of results (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: Validation failed; no search was performed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: City not found (`CITY_NOT_FOUND`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500":
          description: Unexpected failure; the body does not describe the cause
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ServerProblem" }
components:
  schemas:
    SearchResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/HotelResult" }
        nextCursor:
          type: [string, "null"]
          description: Null when there are no more results
    HotelResult:
      type: object
      required: [id, name, starRating, pricePerNightCents, currency, imageUrl]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        starRating: { type: integer, format: int32, minimum: 1, maximum: 5 }
        pricePerNightCents: { type: integer, format: int32 }
        currency: { type: string, example: USD }
        imageUrl: { type: string, description: Path of a static image served by the web app }
    Problem:
      type: object
      required: [title, status, code, errors]
      properties:
        type: { type: string }
        title: { type: string, description: "\"Validation failed\" for 400, \"City not found\" for 404" }
        status: { type: integer, format: int32 }
        detail: { type: string }
        code:
          type: string
          enum: &errorCodes
            - REQUIRED
            - INVALID_VALUE
            - INVALID_DATE_RANGE
            - CHECK_IN_IN_PAST
            - GUESTS_OUT_OF_RANGE
            - INVALID_PRICE_RANGE
            - INVALID_STARS
            - INVALID_SORT
            - INVALID_CURSOR
            - CITY_NOT_FOUND
          description: Repeats the code of the first entry in errors (there is no aggregate code)
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    ServerProblem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string, example: Internal server error }
        status: { type: integer, format: int32 }
        detail: { type: string }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, example: guests }
        code:
          type: string
          enum: *errorCodes
        meta:
          type: object
          additionalProperties: true
          description: "Extra values for the message, e.g. { min: 1, max: 10 } for GUESTS_OUT_OF_RANGE. The schema does not list it as required, but the server always returns it, as an empty object when there is no extra data."
