name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new commit on a PR cancels the older run of that PR. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      # Includes the Testcontainers tests (Docker is preinstalled on ubuntu-latest)
      # and the OpenAPI snapshot test.
      - run: ./gradlew build

  frontend:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm version comes from the "packageManager" field of apps/web/package.json.
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/web/package.json
      # Node version comes from "engines.node" of apps/web/package.json.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: apps/web/package.json
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  contract:
    name: Contract (generated API types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: apps/web/package.json
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - name: Fail if the generated schema differs from the committed file
        run: git diff --exit-code -- src/lib/api/generated/schema.d.ts
